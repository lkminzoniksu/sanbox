<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Hotel PieCharm
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f4f1fb;
        }

        .custom-navbar {
            background-color: #6f42c1;
        }

        .navbar-brand {
            color: white !important;
            font-size: 2rem;
            font-weight: bold;
        }

        .nav-link {
            color: white !important;
            font-weight: bold;
            margin-left: 1rem;
        }

        .nav-link:hover {
            color: #dddddd !important;
        }

        .card {
            border-radius: 16px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        .title {
            color: #6f42c1;
            font-weight: bold;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

    <div class="container-fluid px-4">

        <a
            class="navbar-brand"
            href="/"
        >
            Hotel PieCharm
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/"
                    >
                        Home
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/rooms/"
                    >
                        Rooms
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/customers/"
                    >
                        Customers
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/reservations/"
                    >
                        Reservations
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/reports/"
                    >
                        Reports
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="/about/"
                    >
                        About
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container-fluid mt-4 px-4">

    {% block content %}
    {% endblock %}

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>

</html>
